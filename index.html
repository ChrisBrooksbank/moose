<!doctype html>

    ctx.beginPath(); ctx.ellipse(px, py, rr, rr * .5, 0, 0, TAU); ctx.stroke();
    if (k < .7) { ctx.strokeStyle = `rgba(235,250,255,${e.a * (1 - k) * .5})`; ctx.beginPath(); ctx.ellipse(px, py, rr * .6, rr * .3, 0, 0, TAU); ctx.stroke(); }
  }
  // pellets on the ground
  ctx.fillStyle = 'rgba(38,24,14,.95)';
  for (const p of poops) {
    const px = sxOf(p.x, p.y), py = syOf(p.x, p.y);
    if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;
    ctx.globalAlpha = clamp(1 - (p.age - 180) / 80, 0, 1);
    ctx.beginPath(); ctx.ellipse(px, py, 2.4 * S, 1.5 * S, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(80,56,36,.8)'; ctx.beginPath(); ctx.ellipse(px - .6 * S, py - .6 * S, 1.2 * S, .7 * S, 0, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(38,24,14,.95)';
  }
  ctx.globalAlpha = 1;

  // gather objects
  const list = [];
  const msx = sxOf(moose.x, moose.y), msy = syOf(moose.x, moose.y);
  const mk = moose.x + moose.y;
  for (let cy = cy0 - 1; cy <= cy1 + 1; cy++) for (let cx = cx0 - 1; cx <= cx1 + 1; cx++) {
    const d = getData(cx, cy);
    for (const o of d.objs) {
      const px = W / 2 + ((o.x - camX) - (o.y - camY)) * HW * S, py = H / 2 + ((o.x - camX) + (o.y - camY)) * HH * S;
      if (px < -130 || px > W + 130 || py < -50 || py > H + 260 * S) continue;
      o.px = px; o.py = py; list.push(o);
    }
  }
  list.push({ kind: 'moose', k: mk, px: msx, py: msy });
  for (const e of eff) if (e.t === 'zzz' || e.t === 'drop' || e.t === 'leaf' || e.t === 'pellet') { e.px = sxOf(e.x, e.y); e.py = syOf(e.x, e.y, e.z || 0); e.k = e.x + e.y + 3; e.kind = 'fx'; list.push(e); }
  list.sort((a, b) => a.k - b.k);

  // shadows
  if (li) {
    ctx.fillStyle = `rgba(6,16,14,${li.a})`;
    const shadow = (bx, by, h, wd, sc) => {
      const L = li.len, tx = li.dx * h * L * sc * S * .55, ty = (.22 + Math.abs(li.dx) * .1) * h * L * sc * S * .5;
      const len = Math.hypot(tx, ty) / 2 + wd * sc * S * .55, ang = Math.atan2(ty, tx);
      ctx.beginPath(); ctx.ellipse(bx + tx / 2, by + ty / 2, len, wd * sc * S * .34, ang, 0, TAU); ctx.fill();
    };
    for (const o of list) {

        const sp = spriteFor(o); if (!sp || !sp.shH) continue; shadow(o.px, o.py, sp.shH, sp.shW, o.s);
      }
    }

  }

  // objects
  let mres = null;
  const kf = 1 - Math.exp(-dt * 4);
  for (const o of list) {
    if (o.kind === 'moose') {
      mres = drawMoose(li, T);
      const sc = 1;
      ctx.drawImage(bufC, msx - mres.bcx, msy - mres.bcy, BUF * S, BUF * S);
      if (moose.sink > .03 || depthAt(moose.x, moose.y) > 0.004) {
        const wy = msy + 4 * S - moose.sink * 4 * S;
        ctx.strokeStyle = `rgba(235,250,255,.5)`; ctx.lineWidth = 1.6 * S;
        const pl = Math.sin(T * 2) * .5 + 1;

        ctx.strokeStyle = `rgba(235,250,255,.25)`;
        ctx.beginPath(); ctx.ellipse(msx, wy + 5 * S, 44 * S * pl * .7 + 22 * S, 15 * S, 0, 0, TAU); ctx.stroke();
      }

    }

      if (o.t === 'drop') { ctx.fillStyle = 'rgba(220,245,255,.85)'; ctx.beginPath(); ctx.arc(o.px, o.py, 1.6 * S, 0, TAU); ctx.fill(); }
      else if (o.t === 'leaf') { ctx.fillStyle = `hsl(${o.h},60%,40%)`; ctx.beginPath(); ctx.ellipse(o.px, o.py, 2.6 * S, 1.4 * S, o.age * 5, 0, TAU); ctx.fill(); }
      else if (o.t === 'pellet') { ctx.fillStyle = 'rgba(38,24,14,1)'; ctx.beginPath(); ctx.ellipse(o.px, o.py, 2.4 * S, 1.6 * S, 0, 0, TAU); ctx.fill(); }

        const k = o.age / o.life; ctx.font = `italic ${(14 + k * 8) * S}px Georgia,serif`; ctx.fillStyle = `rgba(255,255,255,${.85 * Math.sin(k * Math.PI)})`;
        const yy = o.py - 44 * S - k * 46 * S, xx = o.px + 14 * S + Math.sin(k * 5) * 6 * S;
        ctx.fillText('z', xx, yy); ctx.font = `italic ${(10 + k * 6) * S}px Georgia,serif`; ctx.fillText('z', xx + 14 * S, yy - 15 * S);

    }
    const sp = spriteFor(o); if (!sp) continue;
    const sc = o.s * (o.kind === 'tree' ? 1 : 1);
    const dw = sp.w * S * sc, dh = sp.h * S * sc, x = o.px - sp.ax * S * sc, y = o.py - sp.ay * S * sc;
    if (o.kind === 'tree') {
      const inFront = o.k > mk - .1;
      const over = inFront && Math.abs(o.px - msx) < dw * .42 + 24 * S && msy > y + dh * .08 && msy - 44 * S < o.py && o.py > msy - 6 * S;
      const tgt = over ? .26 : 1; o.fade += (tgt - o.fade) * kf;

  }

  // butterflies & leaves
  const cxw = camX, cyw = camY;
  if (sky.day > .2) {
    for (const b of bflies) {
      b.a += (Math.random() - .5) * dt * 5; b.x += Math.cos(b.a) * dt * .9; b.y += Math.sin(b.a) * dt * .9; b.z = clamp(b.z + Math.sin(T * 1.7 + b.ph) * dt * .5, .3, 2);
      wrapNear(b, 14);

      ctx.beginPath(); ctx.ellipse(px - 2.2 * S, py, 2.6 * S * fl, 2 * S, -.4, 0, TAU); ctx.ellipse(px + 2.2 * S, py, 2.6 * S * fl, 2 * S, .4, 0, TAU); ctx.fill();

  }

    const px = sxOf(l.x, l.y), py = syOf(l.x, l.y, l.z);

  const sunX = W * (.5 + .44 * sky.az), sunY = H * (.2 - .15 * Math.max(sky.elev, -.2));
  ctx.globalCompositeOperation = 'screen';
  if (low > 0 && sky.elev > -.04) {
    glow(sunX, sunY + H * .05, Math.max(W, H) * .9, [255, 130, 60], .32 * clamp(low, 0, 1));

      m.x += Math.sin(T * .3 + m.ph) * dt * .15; m.y += Math.cos(T * .27 + m.ph) * dt * .15; m.z += Math.sin(T * .5 + m.ph) * dt * .1; wrapNear(m, 20);

    const col = isSun ? '255,236,190' : '200,220,255';
    ctx.lineCap = 'round';

      const gl = im.glints;

        const px = W / 2 + ((gl[i] - camX) - (gl[i + 1] - camY)) * HW * S, py = H / 2 + ((gl[i] - camX) + (gl[i + 1] - camY)) * HH * S;
        if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;
        const w = Math.pow(.5 + .5 * Math.sin(T * (1.3 + gl[i + 3] * 1.1) + gl[i + 2] * 3), 5);

    }

  }

    for (const f of fireflies) {
      f.a += (Math.random() - .5) * dt * 3; f.x += Math.cos(f.a) * dt * f.s * 2; f.y += Math.sin(f.a) * dt * f.s * 2; f.z = clamp(f.z + Math.sin(T + f.ph) * dt * .2, .2, 2.2);
      wrapNear(f, 16);
      const px = sxOf(f.x, f.y), py = syOf(f.x, f.y, f.z), tw = Math.pow(.5 + .5 * Math.sin(T * 1.6 + f.ph * 3), 2);

    drawOrb(sunX, sunY, 20 * S, col, a);
  }

    const mxp = W * (.5 - .44 * sky.az), myp = H * (.2 - .15 * Math.max(sky.moonE, -.2)), a = sstep(-.06, .06, sky.moonE);
    glow(mxp, myp, 130 * S, [120, 150, 220], .34 * a); glow(mxp, myp, 50 * S, [190, 210, 255], .4 * a);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(238,240,232,${a})`; ctx.beginPath(); ctx.arc(mxp, myp, 15 * S, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(190,196,196,${.7 * a})`;
    for (const [dx, dy, r] of [[-4, -3, 4], [3, 4, 3], [4, -5, 2.2], [-5, 5, 2.4]]) { ctx.beginPath(); ctx.arc(mxp + dx * S, myp + dy * S, r * S, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'screen';
  }
  ctx.globalCompositeOperation = 'source-over';

  const vg = ctx.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .78);
  vg.addColorStop(0, 'rgba(0,8,6,0)'); vg.addColorStop(1, `rgba(0,8,6,${.42 + .2 * sky.night})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (sky.elev > -.05 && sky.elev < .18) { ctx.fillStyle = `rgba(255,190,150,${.06 * (1 - Math.abs(sky.elev - .05) / .13)})`; ctx.fillRect(0, 0, W, H); }

  // caption
  if (now - lastCap > 900) { lastCap = now; const c = caption(); if (c !== capText) { capText = c; capEl.style.opacity = 0; setTimeout(() => { capEl.textContent = capText; capEl.style.opacity = 1; }, 900); } }
  if (Math.floor(T) % 6 === 0 && T - lastEvict > 6) { lastEvict = T; evict(); }
}
let firstDone = false, lastCap = 0, capText = '', lastEvict = 0;

/* ============================================================ boot */
function rebuildAssets() { buildSprites(); chunkImg.clear(); bufC.width = 1; }
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  S = clamp(Math.min(W / 1150, H / 640), .75, 1.75);
  RS = S * dpr; RG = Math.min(RS, 1.3);
  rebuildAssets(); firstDone = false; veil.style.opacity = 1;
}
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resize, 200); });
resize();
// find a dry start
{
  const r = findRing(0, 0, 0, 120, (tx, ty) => (!tileBlk(tx, ty) && tileDep(tx, ty) < -0.07 && forestAt(tx, ty) > 0.35 && forestAt(tx, ty) < 0.6 && tileBlk(tx + 1, ty) === 0 && tileBlk(tx, ty + 1) === 0) ? { x: tx, y: ty } : null);
  if (r) { moose.x = camX = r.x; moose.y = camY = r.y; }
  startIdle(3);
  if (Q.has('lake')) { const sp = pickDrink(); if (sp) { moose.x = camX = sp.stand.x; moose.y = camY = sp.stand.y; moose.th = sp.face; } }
}
if (Q.has('sim')) { const cnt = {}; let err = ''; const t0 = performance.now(); let stuck = 0, lx = moose.x, ly = moose.y;
  try { for (let i = 0; i < 12000; i++) { T += .1; updateSky(T); updateMoose(.1); cnt[moose.state] = (cnt[moose.state] || 0) + 1; if (i % 100 === 0) { if (Math.hypot(moose.x - lx, moose.y - ly) < .5 && moose.state === 'walk') stuck++; lx = moose.x; ly = moose.y; } } } catch (e) { err = e.stack; }

  document.title = window.__sim; T = 0; }

  if (f === 'poop') { moose.state = 'poop'; moose.t = 3; moose.dur = 99; }
  else if (fs) { const sp = fs(); if (sp) { moose.x = camX = sp.stand.x; moose.y = camY = sp.stand.y; moose.th = sp.face; moose.act = { kind: f, ...sp }; moose.state = f; moose.t = 5; moose.dur = 999; if (f === 'sleep') { moose.lie = 1; moose.sleepSide = 1; } if (f === 'bathe') moose.sink = .45; } } }

})();
